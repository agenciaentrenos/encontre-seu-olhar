<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portfólio | Kiko Ferrite</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .thumb { cursor: zoom-in; }
    .thumb img { transition: transform .35s ease; }
    .thumb:hover img { transform: scale(1.025); }
  </style>
</head>

<body class="bg-stone-950 text-stone-100">

  <header class="sticky top-0 z-30 border-b border-stone-800 bg-stone-950/90 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5">
      <a href="./" class="text-sm font-bold uppercase tracking-widest text-stone-200">← Encontre Seu Olhar</a>
      <span class="text-xs font-semibold uppercase tracking-widest text-amber-400">Portfólio</span>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-16 md:py-24">
    <div class="mb-16 max-w-3xl">
      <p class="mb-4 text-xs font-semibold uppercase tracking-widest text-amber-500">Kiko Ferrite</p>
      <h1 class="text-4xl font-extrabold tracking-tight text-white md:text-6xl">Imagens que contam histórias.</h1>
      <p class="mt-6 text-lg leading-relaxed text-stone-400">Uma seleção de trabalhos editoriais, retratos e narrativas visuais realizados ao longo de sua trajetória.</p>
    </div>

    <section class="mb-20">
      <div class="mb-7 flex items-end justify-between gap-4">
        <div>
          <p class="text-xs font-semibold uppercase tracking-widest text-amber-500">01</p>
          <h2 class="mt-2 text-2xl font-bold text-white">Reportagem e Expedições</h2>
        </div>
        <span class="text-sm text-stone-500">National Geographic</span>
      </div>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <button type="button" class="thumb flex h-80 items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="national-geographic-01.jpg" aria-label="Ampliar foto 1"><img class="h-full w-full object-contain" src="national-geographic-01.jpg" alt="Reportagem e expedição fotografada por Kiko Ferrite"></button>
        <button type="button" class="thumb flex h-80 items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="national-geographic-02.jpg" aria-label="Ampliar foto 2"><img class="h-full w-full object-contain" src="national-geographic-02.jpg" alt="Reportagem e expedição fotografada por Kiko Ferrite"></button>
        <button type="button" class="thumb flex h-80 items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="national-geographic-03.jpg" aria-label="Ampliar foto 3"><img class="h-full w-full object-contain" src="national-geographic-03.jpg" alt="Reportagem e expedição fotografada por Kiko Ferrite"></button>
        <button type="button" class="thumb flex h-80 items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="national-geographic-04.jpg" aria-label="Ampliar foto 4"><img class="h-full w-full object-contain" src="national-geographic-04.jpg" alt="Reportagem e expedição fotografada por Kiko Ferrite"></button>
        <button type="button" class="thumb flex h-80 items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3 sm:col-span-2 lg:col-span-2" data-full="national-geographic-05.jpg" aria-label="Ampliar foto 5"><img class="h-full w-full object-contain" src="national-geographic-05.jpg" alt="Reportagem e expedição fotografada por Kiko Ferrite"></button>
      </div>
    </section>

    <section class="mb-20">
      <div class="mb-7">
        <p class="text-xs font-semibold uppercase tracking-widest text-amber-500">02</p>
        <h2 class="mt-2 text-2xl font-bold text-white">Retratos e Narrativas Visuais</h2>
      </div>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <button type="button" class="thumb flex h-80 items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="portfolio-fotografico-01.jpg" aria-label="Ampliar foto 6"><img class="h-full w-full object-contain" src="portfolio-fotografico-01.jpg" alt="Trabalho fotográfico de Kiko Ferrite"></button>
        <button type="button" class="thumb flex h-80 items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="portfolio-fotografico-02.jpg" aria-label="Ampliar foto 7"><img class="h-full w-full object-contain" src="portfolio-fotografico-02.jpg" alt="Trabalho fotográfico de Kiko Ferrite"></button>
        <button type="button" class="thumb flex h-80 items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="portfolio-fotografico-03.jpg" aria-label="Ampliar foto 8"><img class="h-full w-full object-contain" src="portfolio-fotografico-03.jpg" alt="Trabalho fotográfico de Kiko Ferrite"></button>
        <button type="button" class="thumb flex h-80 items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="portfolio-fotografico-04.jpg" aria-label="Ampliar foto 9"><img class="h-full w-full object-contain" src="portfolio-fotografico-04.jpg" alt="Trabalho fotográfico de Kiko Ferrite"></button>
        <button type="button" class="thumb flex h-80 items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="portfolio-fotografico-05.jpg" aria-label="Ampliar foto 10"><img class="h-full w-full object-contain" src="portfolio-fotografico-05.jpg" alt="Trabalho fotográfico de Kiko Ferrite"></button>
        <button type="button" class="thumb flex h-80 items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="portfolio-fotografico-06.jpg" aria-label="Ampliar foto 11"><img class="h-full w-full object-contain" src="portfolio-fotografico-06.jpg" alt="Trabalho fotográfico de Kiko Ferrite"></button>
      </div>
    </section>

    <section>
      <div class="mb-7">
        <p class="text-xs font-semibold uppercase tracking-widest text-amber-500">03</p>
        <h2 class="mt-2 text-2xl font-bold text-white">Editorial e Publicações</h2>
      </div>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <button type="button" class="thumb flex h-[30rem] items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="revista-gol-01.jpg" aria-label="Ampliar foto 12"><img class="h-full w-full object-contain" src="revista-gol-01.jpg" alt="Publicação editorial fotografada por Kiko Ferrite"></button>
        <button type="button" class="thumb flex h-[30rem] items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="revista-gol-02.jpg" aria-label="Ampliar foto 13"><img class="h-full w-full object-contain" src="revista-gol-02.jpg" alt="Publicação editorial fotografada por Kiko Ferrite"></button>
        <button type="button" class="thumb flex h-[30rem] items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="revista-gol-03.jpg" aria-label="Ampliar foto 14"><img class="h-full w-full object-contain" src="revista-gol-03.jpg" alt="Publicação editorial fotografada por Kiko Ferrite"></button>
        <button type="button" class="thumb flex h-[30rem] items-center justify-center overflow-hidden rounded-2xl bg-stone-900 p-3" data-full="revista-gol-04.jpg" aria-label="Ampliar foto 15"><img class="h-full w-full object-contain" src="revista-gol-04.jpg" alt="Publicação editorial fotografada por Kiko Ferrite"></button>
      </div>
    </section>
  </main>

  <div id="lightbox" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/95 p-4 sm:p-8" role="dialog" aria-modal="true" aria-label="Imagem ampliada">
    <button type="button" id="close" class="absolute right-4 top-3 z-10 flex h-12 w-12 items-center justify-center rounded-full bg-white/10 text-3xl text-white hover:bg-white/20" aria-label="Fechar">×</button>
    <button type="button" id="prev" class="absolute left-3 top-1/2 z-10 -translate-y-1/2 rounded-full bg-white/10 px-4 py-3 text-3xl text-white hover:bg-white/20" aria-label="Imagem anterior">‹</button>
    <img id="large" class="max-h-[88vh] max-w-[86vw] select-none rounded-lg object-contain" alt="Imagem ampliada do portfólio">
    <button type="button" id="next" class="absolute right-3 top-1/2 z-10 -translate-y-1/2 rounded-full bg-white/10 px-4 py-3 text-3xl text-white hover:bg-white/20" aria-label="Próxima imagem">›</button>
    <div id="counter" class="absolute bottom-5 rounded-full bg-white/10 px-4 py-2 text-xs font-semibold text-white"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const thumbnails = Array.from(document.querySelectorAll('.thumb[data-full]'));
      const box = document.getElementById('lightbox');
      const large = document.getElementById('large');
      const counter = document.getElementById('counter');
      const closeButton = document.getElementById('close');
      const previousButton = document.getElementById('prev');
      const nextButton = document.getElementById('next');
      let active = 0;
      let startX = 0;

      function show(index) {
        active = (index + thumbnails.length) % thumbnails.length;
        const thumbnail = thumbnails[active];
        const image = thumbnail.querySelector('img');
        large.src = thumbnail.getAttribute('data-full');
        large.alt = image ? image.alt : 'Imagem ampliada do portfólio';
        counter.textContent = (active + 1) + ' / ' + thumbnails.length;
      }

      function openLightbox(index) {
        show(index);
        box.classList.remove('hidden');
        box.classList.add('flex');
        document.body.classList.add('overflow-hidden');
      }

      function closeLightbox() {
        box.classList.add('hidden');
        box.classList.remove('flex');
        large.removeAttribute('src');
        document.body.classList.remove('overflow-hidden');
      }

      thumbnails.forEach(function (thumbnail, index) {
        thumbnail.addEventListener('click', function () {
          openLightbox(index);
        });
      });

      closeButton.addEventListener('click', closeLightbox);
      previousButton.addEventListener('click', function () {
        show(active - 1);
      });
      nextButton.addEventListener('click', function () {
        show(active + 1);
      });

      document.addEventListener('keydown', function (event) {
        if (box.classList.contains('hidden')) return;
        if (event.key === 'Escape') closeLightbox();
        if (event.key === 'ArrowLeft') show(active - 1);
        if (event.key === 'ArrowRight') show(active + 1);
      });

      box.addEventListener('click', function (event) {
        if (event.target === box) closeLightbox();
      });

      box.addEventListener('touchstart', function (event) {
        startX = event.changedTouches[0].clientX;
      });

      box.addEventListener('touchend', function (event) {
        const endX = event.changedTouches[0].clientX;
        const difference = endX - startX;
        if (Math.abs(difference) > 50) {
          if (difference > 0) show(active - 1);
          else show(active + 1);
        }
      });
    });
  </script>
</body>
</html>
